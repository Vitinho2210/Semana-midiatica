<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Green IoT</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">
</head>
<body class="quiz-body">
    <div class="quiz-botao">
        <a href="../index.html">&larr;&nbsp;Voltar</a>
    </div>
    
    <div class="quiz-container">
        <section id="quiz">
            <div class="quiz-topo">
                <span id="contador">Questão 1 de 20</span>
                <span id="pontuacao">Acertos: 0</span>
            </div>

            <div class="progresso-container">
                <div id="progresso"></div>
            </div>
            <h1 id="pergunta"></h1>
            <div id="alternativas"></div>
            <button id="proxima" disabled>
                Próxima questão
            </button>
        </section>

        <section id="resultado" class="resultado hidden">
            <h1>Quiz finalizado!</h1>
            <p>
                Você acertou
                <strong id="acertos-final"></strong>
                de 20 questões.
            </p>
            <p>
                Aproveitamento:
                <strong id="porcentagem"></strong>
            </p>
            <button id="reiniciar">
                Reiniciar quiz
            </button>
        </section>
    </div>
    <script src="../js/quiz.js"></script>
</body>
</html>
